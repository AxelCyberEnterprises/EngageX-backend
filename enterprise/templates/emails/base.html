<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>{% block title %}{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
            margin-bottom: 30px;
        }
        .content {
            padding: 0 10px;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white !important;
            text-decoration: none;
            border-radius: 4px;
            margin: 20px 0;
        }
        .btn-primary {
            background-color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>{% block heading %}{% endblock %}</h2>
    </div>
    
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    
    <div class="footer">
        <p>&copy; {% now "Y" %} {{ enterprise.name|default:"EngageX" }}. All rights reserved.</p>
        <p>
            <a href="{{ protocol }}://{{ domain }}/privacy">Privacy Policy</a> | 
            <a href="{{ protocol }}://{{ domain }}/terms">Terms of Service</a>
        </p>
    </div>
</body>
</html>
